name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: Fuzz agent file-upload paths
        run: go test ./internal/agent -run='^$' -fuzz='^FuzzFileUploadPaths$' -fuzztime=15s -parallel=2
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: go build ./...
