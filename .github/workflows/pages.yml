name: Distribution site

on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/install.sh', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'scripts/install.sh', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assemble static site
        run: |
          mkdir -p dist/site
          cp -R site/. dist/site/
          cp scripts/install.sh dist/site/install
          touch dist/site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
