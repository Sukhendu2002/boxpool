name: Boot benchmark

# Manual only: it downloads ~150 MB of Firecracker artifacts and measures
# timing on a nested VM, so it is a benchmark, not a per-PR test.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Boots to measure
        default: "10"
  # TEMPORARY (remove before merge): workflow_dispatch only works once the
  # file is on the default branch, so run it from this PR.
  pull_request:
    paths:
      - scripts/bench-boot.sh
      - .github/workflows/bench-boot.yml

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Lint the benchmark script
        run: shellcheck scripts/bench-boot.sh
      - name: Grant the runner KVM group access
        run: |
          sudo groupadd -f kvm
          sudo usermod -aG kvm "$(id -un)"
          sudo chgrp kvm /dev/kvm
          sudo chmod 0660 /dev/kvm
      - name: Install rootfs tools
        run: command -v unsquashfs || { sudo apt-get update && sudo apt-get install -y squashfs-tools; }
      - name: Run the boot benchmark
        env:
          RUNS: ${{ inputs.runs || '10' }}
        shell: bash
        run: |
          [[ $RUNS =~ ^[1-9][0-9]*$ ]] || { echo "runs must be a positive integer" >&2; exit 1; }
          mkdir -p bench
          sg kvm -c "LOG_DIR=bench/logs scripts/bench-boot.sh $RUNS" | tee bench/results.txt
          { echo '### Guide boot args'; echo '```text'; cat bench/results.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Firecracker's own boot-time test skips the i8042 keyboard probe;
      # measure what that is worth with the same artifacts.
      - name: Run the boot benchmark without the i8042 probe
        env:
          RUNS: ${{ inputs.runs || '10' }}
        shell: bash
        run: |
          sg kvm -c "EXTRA_BOOT_ARGS='i8042.noaux i8042.nomux i8042.nopnp i8042.dumbkbd' LOG_DIR=bench/logs-i8042 scripts/bench-boot.sh $RUNS" | tee bench/results-i8042.txt
          { echo '### Guide boot args + i8042 off'; echo '```text'; cat bench/results-i8042.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-boot-${{ github.run_id }}-${{ github.run_attempt }}
          path: bench/
